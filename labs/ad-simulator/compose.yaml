services:
  ad-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberlab-ad-simulator
    networks:
      - cyberlab-isolated
    restart: unless-stopped

  ad-viz:
    build:
      context: .
      dockerfile: Dockerfile.visualizer
    container_name: cyberlab-ad-viz
    ports:
      - "127.0.0.1::8080"
    networks:
      - cyberlab-isolated
    restart: unless-stopped

networks:
  cyberlab-isolated:
    internal: true
